name: Build and Release ExtasisDonker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-latest
            artifact_name: macOS-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          
          # VST3 bundles
          find build/ExtasisDonker_artefacts -name "*.vst3" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # AU components (macOS)
          find build/ExtasisDonker_artefacts -name "*.component" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # Standalone App (macOS)
          find build/ExtasisDonker_artefacts -name "*.app" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # Standalone EXE (Windows) & CLAP plugins
          find build/ExtasisDonker_artefacts -type f \( -name "*.clap" -o -name "*.exe" \) -exec cp "{}" artifacts/ \; 2>/dev/null || true
          
          # Docs, License & Installer
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          for doc in LICENSE MANUAL.md README.md PRESENTATION.md TECHNICAL.md ARCHITECTURE.md RELEASE_RULES.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-Build
          path: release-files/macOS/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir final-assets
          cd release-files
          zip -r ../final-assets/ExtasisDonker-Windows.zip Windows/
          zip -r ../final-assets/ExtasisDonker-macOS.zip macOS/
          zip -r ../final-assets/ExtasisDonker-Linux.zip Linux/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Extasis Donker ${{ github.ref_name }} (Free & Open Source)"
          body: |
            ## ⚡ Extasis Donker ${{ github.ref_name }} — Free & Open Source Edition (GPLv3)

            **Extasis Donker** is now **100% Free & Open Source** under the **GNU General Public License v3.0 (GPLv3)** — no demo limits, no serial keys, no DRM!

            ### 🌟 Key Highlights & Improvements in v4.0.0:
            - **Free & Open Source (GPLv3)**: Completely removed activation overlays, serial validation, and 10-minute demo restrictions.
            - **Real-Time Safe Audio Engine**:
              - Lock-free oscilloscope ring buffer (`juce::AbstractFifo`) — zero locks or allocations on the audio thread.
              - Thread-safe audition MIDI queue (`SpinLock` swap in `processBlock`).
              - Cached atomic parameter pointers and smoothed filter cutoff & master gain (zero zipper noise).
              - Linearly interpolated stereo chorus (`Top Spread`) with dynamic sample-rate sizing (supports up to 192 kHz).
              - Fixed `Auto Pump` so presets with 100% sidechain remain fully audible when DAW transport is stopped.
              - Fixed Mod Wheel (CC 1) routing to dynamically open filter cutoff up to +200%.
            - **GUI & UX Overhaul**:
              - Fixed all resize scaling issues (bottom rack screws, cyan accent strip, knob labels, trigger pad glow, and custom preset ComboBox LookAndFeel).
              - Wired native `SavePresetOverlay` with Return/Escape keyboard shortcuts.
              - Integrated **Output Peak Meter** (with peak hold & clip indicator) and **MIDI Activity LED** inside the TX81Z phosphor LCD.
              - Double-click any knob to reset to its factory default value.
              - Fixed LCD hover tooltips for `AUTO PUMP`, `PITCH DROP`, and `RESONANCE`.
            - **40 Curated Factory Presets**: 40 distinct, musically tuned club presets across UK Bounce, Guaracha, LatelyBass, Hardbass, Garage & Acid.

            ### 📦 Formats Included:
            - **macOS**: Universal Binary (Apple Silicon ARM64 + Intel x86_64) — VST3, AU, CLAP, Standalone
            - **Windows**: x64 — VST3, CLAP, Standalone (.exe)
            - **Linux**: x64 — VST3, CLAP

            ### 🤝 License & Contributions
            Released under **GNU GPLv3**. Contributions, pull requests, and custom presets are welcome!
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
