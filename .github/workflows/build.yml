name: Build and Release ExtasisDonker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Windows-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-latest
            artifact_name: macOS-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: Linux-Build
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          
          # VST3 bundles
          find build/ExtasisDonker_artefacts -name "*.vst3" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # AU components (macOS)
          find build/ExtasisDonker_artefacts -name "*.component" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # Standalone App (macOS)
          find build/ExtasisDonker_artefacts -name "*.app" -type d -exec cp -r "{}" artifacts/ \; 2>/dev/null || true
          
          # Standalone EXE (Windows) & CLAP plugins
          find build/ExtasisDonker_artefacts -type f \( -name "*.clap" -o -name "*.exe" \) -exec cp "{}" artifacts/ \; 2>/dev/null || true
          
          # Docs & Installer
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
            chmod +x artifacts/installer/INSTALL_LINUX.sh 2>/dev/null || true
          fi
          for doc in MANUAL.md README.md PRESENTATION.md TECHNICAL.md ARCHITECTURE.md RELEASE_RULES.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: release-files/Windows/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-Build
          path: release-files/macOS/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build
          path: release-files/Linux/

      - name: Package Release Files
        run: |
          mkdir final-assets
          cd release-files
          zip -r ../final-assets/ExtasisDonker-Windows.zip Windows/
          zip -r ../final-assets/ExtasisDonker-macOS.zip macOS/
          zip -r ../final-assets/ExtasisDonker-Linux.zip Linux/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Extasis Donker ${{ github.ref_name }}"
          body: |
            ## ⚡ Extasis Donker ${{ github.ref_name }} — Official Release

            Official multi-platform production release of **Extasis Donker**, the premier FM synthesis workstation purpose-built for hard-hitting Donk, LatelyBass, Guaracha, UK Bounce, and Club electronic music.

            ### 🌟 Key Highlights & Features:
            - **Official Plugin Identity**: Cleanly registered in all DAWs (Ableton Live, Logic Pro, FL Studio, Reaper, Cubase) as **Extasis Donker**.
            - **TX81Z-Modeled FM Engine**: 2-Operator FM architecture with seamless continuous morphing between Pure Sine (W1), Yamaha Half-Sine (W5), and Rectified (W3) shapes.
            - **Dynamic Vector GUI & Resizability**: Freely scalable vector UI with locked 700:400 aspect ratio, crisp typography on high-DPI/Retina/4K displays.
            - **Interactive Info-Nav (LCD Tooltips)**: Real-time phosphor dot-matrix LCD displays live oscilloscope trace and dynamic hover descriptions for every parameter.
            - **Native Preset System**: Internal overlay (`SavePresetOverlay`) for seamless in-app user preset saving, plus **40 curated factory presets**.
            - **MIDI Expressiveness**: Pitch Bend wheel support (±2 semitones) and Mod Wheel (CC1) dynamically driving lowpass filter cutoff expansion up to +200%.
            - **Tone & Space Processing**: Pre-master TX Crunch (12-bit DAC emulation), Erosion (2.8kHz ring mod), Punch Slam (OTT transient compression), dedicated mono sub-oscillator, and Top Spread stereo dimension above 180Hz.
            - **Evaluation & Licensing**: 10-minute demo evaluation with graceful silence timeout; instant reactivation upon reloading or unlocking with offline serial.

            ### 📦 Formats Included:
            - **macOS**: Universal Binary (Apple Silicon ARM64 + Intel x86_64) — VST3, AU, CLAP, Standalone
            - **Windows**: x64 — VST3, CLAP, Standalone (.exe)
            - **Linux**: x64 — VST3, CLAP

            ### 🔑 Licensing
            Unlock your full lifetime license at **[Gumroad](http://laurorobles.gumroad.com)**.
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
